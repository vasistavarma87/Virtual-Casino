<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Virtual Casino (Simulation)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <!-- Simulation Warning Banner -->
  <div class="warning-banner">
    ⚠️ <strong>SIMULATION ONLY:</strong> 100% Fake Coins. No real money or purchases.
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">🎰 Virtual Casino</div>
      <h2>Create Your Account</h2>
      <p class="text-muted">Start with 1,000 free simulation coins</p>
    </div>

    <!-- Alert / Error display box -->
    <div id="authAlert" class="alert d-none"></div>

    <form id="signupForm" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-input"
          placeholder="e.g. lucky_player"
          minlength="3"
          required
          autocomplete="username"
        />
        <small class="form-hint">At least 3 characters</small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          placeholder="••••••••"
          minlength="6"
          required
          autocomplete="new-password"
        />
        <small class="form-hint">At least 6 characters (hashed with bcrypt)</small>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
        Sign Up & Claim 1,000 Coins
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="login.html">Log In</a></p>
      <p><a href="index.html" class="text-muted">← Back to Home</a></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
